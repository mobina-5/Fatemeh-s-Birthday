<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>Happy Birthday Fatemeh</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #app { width: 100%; height: 100%; position: relative; }

        .page {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            -webkit-background-size: cover;
            transition: opacity 0.6s ease-in-out;
        }

        .page.active { display: flex; }

        .content-container {
            width: 100%;
            height: 100%;
            max-width: 750px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px 10px 55px 10px;
        }

        /* کادر شیشه‌ای بدون اسکرول و بسیار مرتب */
        .text-box-wrapper {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 680px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .text-content {
            font-size: 0.65rem; /* فونت خیلییی ریز برای جلوگیری از شلوغی و عدم نیاز به اسکرول */
            line-height: 1.7;
            white-space: pre-line;
            display: inline-block;
            width: 100%;
            font-weight: 700;
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0 2px 3px rgba(0,0,0,0.6);
        }

        .text-content span.emoji {
            display: inline-block;
            text-shadow: none !important;
        }

        .page-16-text {
            font-size: 0.82rem;
            line-height: 1.9;
            white-space: pre-line;
            display: inline-block;
            width: 100%;
            font-weight: 700;
            text-shadow: none !important;
        }

        /* دکمه‌های ناوبری کاملاً امن و جدا از کادر متن */
        .nav-btn {
            color: #fff;
            border: none;
            padding: 7px 14px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            position: absolute;
            bottom: 10px;
            z-index: 10;
        }

        .nav-btn:hover { transform: scale(1.02); opacity: 0.9; }

        .page-16-container {
            height: 100vh;
            width: 100%;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ffe4e6, #fbcfe8, #fdf2f8, #fce7f3, #fae8ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .scrolling-text {
            position: absolute;
            animation: scrollUp 130s linear infinite;
            padding: 20px;
            max-width: 680px;
            width: 90%;
        }

        @keyframes scrollUp {
            0% { transform: translateY(110vh); }
            100% { transform: translateY(-130%); }
        }

        @media (max-width: 480px) {
            .text-content { font-size: 0.62rem; line-height: 1.65; }
            .page-16-text { font-size: 0.76rem; line-height: 1.85; }
            .text-box-wrapper { padding: 8px 10px; }
            .nav-btn { padding: 6px 12px; font-size: 0.7rem; bottom: 8px; }
        }
    </style>

    const app = document.getElementById('app');

        } else if (page.bgStyle) {
            pageDiv.setAttribute('style', pageDiv.getAttribute('style') + '; ' + page.bgStyle);
        }

        if (index === 0) {
            pageDiv.innerHTML = page.customHtml;
        } else if (index === pages.length - 1) {
            const customColors = ["#1f2e5a", "#5a70c4", "#412896", "#8269d7", "#110c26", "#036ca6"];
            const lines = page.text.trim().split('\n');
            let coloredTextHTML = '';
            lines.forEach((line, lineIdx) => {
                const assignedColor = customColors[lineIdx % customColors.length];
                coloredTextHTML += `<span style="color: ${assignedColor}; display: inline-block; width: 100%; margin-bottom: 5px;">${formatTextWithEmojis(line)}</span>`;
            });

            pageDiv.innerHTML = `
                <div class="page-16-container">
                    <div class="scrolling-text">
                        <div class="page-16-text" style="text-align: center;">${coloredTextHTML}</div>
                    </div>
                </div>
            `;
        } else {
            let buttonsHTML = `<button class="nav-btn" onclick="nextPage(${index + 1})" style="background: ${page.color}; color: #111; font-weight: 700; right: 10px;">${page.btn}</button>`;

            if (index > 0) {
                buttonsHTML += `<button class="nav-btn" onclick="prevPage(${index - 1})" style="background: rgba(0,0,0,0.75); color: #fff; left: 10px;">قبلی ↩</button>`;
            }

            pageDiv.innerHTML = `
                <div class="content-container">
                    <div class="text-box-wrapper">
                        <div class="text-content" style="color: ${page.color};">${formatTextWithEmojis(page.text)}</div>
                    </div>
                    ${buttonsHTML}
                </div>
            `;
        }
        app.appendChild(pageDiv);
    });

    function nextPage(index) {
        if (index === pages.length - 1) {
            music.pause();
            music.currentTime = 0;
            music2.currentTime = 0;
            music2.play().catch(e => console.log("Audio 2 play blocked", e));
        } else {
            if(!music2.paused) {
                music2.pause();
                music2.currentTime = 0;
            }
            if(music.paused) {
                music.play().catch(e => console.log("Audio 1 play blocked", e));
            }
        }

        if (index < pages.length) {
            document.querySelector('.page.active').classList.remove('active');
            setTimeout(() => {
                const nextP = document.getElementById(`page-${index}`);
                if (nextP) nextP.classList.add('active');
            }, 60);
        }
    }

    function prevPage(index) {
        if(!music2.paused) {
            music2.pause();
            music2.currentTime = 0;
        }
        if(music.paused) {
            music.play().catch(e => console.log("Audio 1 play blocked", e));
        }

        document.querySelector('.page.active').classList.remove('active');
        setTimeout(() => {
            const preventP = document.getElementById(`page-${index}`);
            if (preventP) preventP.classList.add('active');
        }, 60);
    }

    window.addEventListener('click', () => {
        const activePage = document.querySelector('.page.active');
        if (activePage && activePage.id === `page-${pages.length - 1}`) {
            if(music2.paused) {
                music2.play().catch(e => console.log("Audio 2 play blocked", e));
            }
        } else {
            if(music.paused) {
                music.play().catch(e => console.log("Audio 1 play blocked", e));
            }
        }
    }, { once: true });
